    <div>

        <h1>Arrays</h1>
        <hr>
        <p>See console output</p>
        <hr>
        
        <h2>Array Methods</h2>
        <hr>
        
        <p><button id="arrayPush">push()</button></p>

        <p><button id="arrayPop">pop()</button>      
        
        <p><button id="arrayUnshift">unshift()</button></p>
                
        <p><button id="arrayShift">shift()</button></p>

        <p><button id="arraySort">sort()</button></p>
        
        <p><button id="arrayReverseSort">reverse sort</button></p>
        
        <h2>2D Arrays</h2>
        <hr>

        <p>A 2D array is an array of arrays.</p>
        <br>
        <br>

        <h2>3D Arrays</h2>
        <hr>

        <p>A 3D array is an array of arrays of arrays. A multi-layered structure.</p>
        <br>
        <br>

        <h2>Jagged Arrays</h2>
        <hr>

        <p>A jagged array is an array of arrays where each sub-array can have a different length.</p>
        <br>
        <br>
