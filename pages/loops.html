        <h2>For Loops</h2>

        <p>Repeat some code FOR a set amount of times</p>
        <p>For loops work really well with arrays, and objects.</p>

        <p><button id="forLoop">For Loop</button></p>
        <p><button id="forLoopWithContinue">For Loop with Continue</button></p>
        <p><button id="forLoopWithBreak">For Loop with Break</button></p>

        <hr>

        <h2>While Loops</h2>

        <p>Repeat some code WHILE a condition is true. Potentially infinite.</p>
        
        <p><button id="whileLoop">While Loop</button></p>

        <p><button id="doWhileLoop">Do While Loop</button></p>

        <p><button id="whileLoopWithIf">While Loop With If</button></p>
