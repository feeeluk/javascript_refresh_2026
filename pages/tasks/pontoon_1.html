<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontoon V1</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/tasks/pontoon_1.css?v003">
    <script src="/javascript/tasks/pontoon_1.js" defer></script>
</head>
<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Pontoon V1</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">
                    
                    <div id="actions" class="visible">

                        <button id="startGame" class="visible">Start Game</button>
                        <br>
                        
                        <button id="twist" class="hidden">Twist</button>
                        <button id="stick" class="hidden">Stick</button>
                        <br>

                    </div>
                    
                    <div id="details" class="hidden">

                        Player's score: <span id="showPlayerScore"></span>
                        <br>
                        Player's number of cards: <span id="showPlayerNumberOfCards"></span>
                        <br>
                        Images of Player's cards: <span id="showPlayerCards"></span>

                        <br>

                        Computer's score: <span id="showComputerScore"></span>
                        <br>
                        Computer's number of cards: <span id="showComputerNumberOfCards"></span>
                        <br>
                        Images of Computer's cards: <span id="showComputerCards"></span>

                    </div>

                    <br>

                    <div id="results" class="hidden">
                        Results: <span id="showResults"></span>
                    </div>

                </td>
            </tr>

            <tr>
                <td id="code" class="code">
                    <button id="code">View Code</button>
                </td>
            </tr>
            
        </table>       

    </div>

</body>
</html>
