<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="/styles/style.css">
    <style>
        
    </style>
    <script src="/javascript/tasks/number_guessing_game.js" defer></script>
</head>
<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Number Guessing Game</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">
                    <p>
                        See console output for more detail.
                    </p>

                    <p>
                        <br>
                        <label>Set min value:</label>
                        <input type="number" id="min" value="1">
                        <br>
                        <label>Set max value:</label>
                        <input type="number" id="max" value="10">
                    </p>

                    <p>
                        <button id="start">Start Game</button>
                    </p>

                    <p id="guesses" style="display: none;">
                        Number of guesses = <span id="countOfGuesses"></span>
                    </p>

                    <p>
                        <button id="broCodeGame">Bro Code solution</button>
                    </p>

                </td>
            </tr>
            
            <tr>
                <td>
                    <h3>Resources</h3>
                    <p>
                        <a href="https://www.youtube.com/watch?v=uSJXZ3LkABE&list=PLZPZq0r_RZOO1zkgO4bIdfuLpizCeHYKv&index=7">BroCode - Counter Program</a>
                </td>
            </tr>

            <tr>
                <td id="code" class="code">
                    <button id="code">View Code</button>
                </td>
            </tr>
            
        </table>       

    </div>

</body>
</html>
