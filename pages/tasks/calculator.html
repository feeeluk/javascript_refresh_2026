<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/styles/style.css">
    <style>

        .calculatorButton{
            width: 50px;
        }

        #buttons{
            width: 250px;
            display: flexbox;
            flex-wrap: wrap;
        }
    </style>
    <script src="/javascript/tasks/calculator.js" defer></script>
</head>
<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Calculator</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">

                    <div id="display"></div>
                    <div id="buttons">
                        <button id="add" class="calculatorButton">+</button>
                        <button id="7" class="calculatorButton">7</button>
                        <button id="8" class="calculatorButton">8</button>
                        <button id="9" class="calculatorButton">9</button>
                        <button id="minus" class="calculatorButton">-</button>
                        <button id="4" class="calculatorButton">4</button>
                        <button id="5" class="calculatorButton">5</button>
                        <button id="6" class="calculatorButton">6</button>
                        <button id="multiply" class="calculatorButton">*</button>
                        <button id="1" class="calculatorButton">1</button>
                        <button id="2" class="calculatorButton">2</button>
                        <button id="3" class="calculatorButton">3</button>
                        <button id="divide" class="calculatorButton">/</button>
                        <button id="0" class="calculatorButton">0</button>
                        <button id="period" class="calculatorButton">.</button>
                        <button id="equals" class="calculatorButton">=</button>
                        <button id="clear" class="calculatorButton">C</button>
                        <button id="delete" class="calculatorButton"><</button>
                    </div>
                </td>
            </tr>
            
            <tr>
                <td>
                    <h3>Resources</h3>
                    <p>
                        <a href="https://www.youtube.com/watch?v=I5kj-YsmWjM&list=PLZPZq0r_RZOO1zkgO4bIdfuLpizCeHYKv&index=62">BroCode - Calculator</a>
                </td>
            </tr>

            <tr>
                <td id="code" class="code">
                    <button id="code">View Code</button>
                </td>
            </tr>
            
        </table>       

    </div>

</body>
</html>
