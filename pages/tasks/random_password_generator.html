<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="/styles/style.css">
    <style>
        
    </style>
    <script src="/javascript/tasks/random_password_generator.js" defer></script>
</head>
<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Random Password Generator</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">
                    <p>
                        See console output for more detail.
                    </p>

                    <p>
                        <label for="passwordLength">Characters: </label>
                        <input type="number" id="passwordLength" minlength="6" value="10">
                        <br>

                        <label for="">Lowercase</label>
                        <input type="checkbox" id="includeLowercase" checked>
                        <br>

                        <label for="">Uppercase</label>
                        <input type="checkbox" id="includeUppercase">
                        <br>

                        <label for="">Numbers</label>
                        <input type="checkbox" id="includeNumbers">
                        <br>
                        
                        <label for="">Symbols</label>
                        <input type="checkbox" id="includeSymbols">
                        <br>
                        <br>

                        <button id="generatePassword">Generate Password</button>

                        <div id="showPassword" style="display: none;"></div>
                    </p>
                </td>
            </tr>
            
            <tr>
                <td>
                    <h3>Resources</h3>
                    <p>
                        <a href="https://www.youtube.com/watch?v=1cdXwYEFDAg&list=PLZPZq0r_RZOO1zkgO4bIdfuLpizCeHYKv&index=30">BroCode - Random Password Generator</a>
                </td>
            </tr>

            <tr>
                <td id="code" class="code">
                    <button id="code">View Code</button>
                </td>
            </tr>
            
        </table>       

    </div>

</body>
</html>
