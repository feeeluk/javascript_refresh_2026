<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontoon V2</title>
    <link rel="stylesheet" href="/styles/tasks/pontoon_2.css?v015">
    <script src="/javascript/tasks/pontoon_2_deck.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_state.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_ui.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_flow.js" defer></script>
</head>
<body>

    <div id="gameArea">

        <div id="titleArea">
            <h1>Pontoon V2</h1>
        </div>

        <!-- Alt -->
        <div id="play">
            <h1>Pontoon V2</h1>
            <button id="playButton">Play Game</button>
        </div>
        
        <div id="usersArea">
                
            <div id="playerArea">
                <div class="header"><h4>Player</h4></div>
                <div class="cardsArea">
                    <span class="cardsTitle">Cards:</span>
                    <span id="pCards"></span>

                    <span id="aceChoice">Ace value:</span>
                    <button id="aceOne" class="choices" disabled>1</button>
                    <button id="aceEleven" class="choices" disabled>11</button>

                    <span id="playerActions">Player actions:</span>
                    <button id="twist" class="choices" disabled>Twist</button>
                    <button id="stick" class="choices" disabled>Stick</button>
                </div>
                <div class="score">Score:<span id="pScore"></span></div>
                <div class="count">Count:<span id="pCount"></span></div>
                <div class="history">History:<span><ul id="pHistory"></ul></span></div>
            </div>

            <div id="dealerArea">
                <div class="header"><h4>Player</h4></div>
                <div class="cardsArea">
                    <span class="cardsTitle">Cards:</span>
                    <span id="dCards"></span>
                </div>
                <div class="score">Score:<span id="dScore"></span></div>
                <div class="count">Count:<span id="dCount"></span></div>
                <div class="history">History:<span><ul id="dHistory"></ul></span></div>
            </div>

        </div>

        <div id="resultArea">
            <span id="result1" class="result1">Result:</span>
            <span id="result2" class="result2">
                <span id="resultMessage">Result message</span>
                <button id="playAgain" disabled>Play Again</button>
            </span>
            <span id="result3" class="result1"></span>
        </div>

    </div>

</body>
</html>
