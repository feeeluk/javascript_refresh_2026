<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontoon V2</title>
    <link rel="stylesheet" href="/styles/tasks/pontoon_2.css?v013">
    <script src="/javascript/tasks/pontoon_2_deck.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_state.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_ui.js" defer></script>
    <script src="/javascript/tasks/pontoon_2_flow.js" defer></script>
</head>
<body>

    <div id="gameArea">

        <div id="titleArea">
            <h1>Pontoon V2</h1>
        </div>

        <!-- Alt -->
        <div id="play">
            <h1>Pontoon V2</h1>
            <button id="playButton">Play Game</button>
        </div>
        
        <div id="usersArea">
                
            <div id="playerArea">
                <div class="header"><h4>Player</h4></div>
                <div class="cards">Cards:<span id="pCards"></span></div>
                <div class="score">Score:<span id="pScore"></span></div>
                <div class="count">Count:<span id="pCount"></span></div>
                <div class="history">History:<span id="pHistory"></span></div>
            </div>

            <div id="dealerArea">
                <div class="header"><h4>Player</h4></div>
                <div class="cards">Cards:<span id="dCards"></span></div>
                <div class="score">Score:<span id="dScore"></span></div>
                <div class="count">Count:<span id="dCount"></span></div>
                <div class="history">History:<span id="dHistory"></span></div>
            </div>

        </div>

        <div id="resultArea">
            <span id="result1" class="result1">Result:</span>
            <span id="result2" class="result2"><button id="playAgain">Play Again</button></span>
            <span id="result3" class="result1"></span>
        </div>

    </div>

</body>
</html>
