<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="/styles/style.css">
    <script src="/javascript/tasks/temperature_conversion_program.js" defer></script>
</head>
<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Temperature Conversion Program</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">
                    <p>
                        See console output for more detail.
                    </p>

                    <p>
                        <h2>Temperature Conversion Program</h2>
                        <input type="text" id="tempInput" value="50">
                        <br>
                        <br>

                        <input type="radio" id="toFarenheit" name="converstionType" value="toFarenheit" checked>
                        <label for="toFarenheit">Convert Celsius to Farenheit</label>
                        <br>

                        <input type="radio" id="toCelsius" name="converstionType" value="toCelsius">
                        <label for="toCelsius">Convert Farenheit to Celsius</label>
                        <br>
                        <br>

                        <button id="convert">Convert</button>
                        <br>
                        <br>

                        <span id="result">test</span>
                    </p>
                </td>
            </tr>
            
            <tr>
                <td>
                    <h3>Resources</h3>
                    <p>
                        <a href="https://www.youtube.com/watch?v=6xrTdpIAsb0&list=PLZPZq0r_RZOO1zkgO4bIdfuLpizCeHYKv&index=24">BroCode - Temparature Conversion Program</a>
                </td>
            </tr>

            <tr>
                <td id="code" class="code">
                    <button id="code">View Code</button>
                </td>
            </tr>
            
        </table>       

    </div>

</body>
</html>
