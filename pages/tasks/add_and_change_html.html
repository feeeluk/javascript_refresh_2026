<!DOCTYPE html>

<body>

    <div id="topic" class="topic">

        <table>

            <tr>
                <td id="title" class="title">
                    <h1>Add and Change HTML</h1>
                </td>
            </tr>

            <tr>
                <td id="link" class="link">
                    <a href="/index.html">Back</a>
                </td>
            </tr>

            <tr>
                <td id="main" class="main">
                    <p>
                        See console output for more detail.
                    </p>

                    <div id="box1" class="box">
                        <p>
                            Box 1
                        </p>
                        <button id="button1" class="myButton">Create a new element (append())</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="box2" class="box">
                        <p>
                            Box 2
                        </p>
                        <button id="button2" class="myButton">Create a new element (prepend())</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="box3" class="box">
                        <p>
                            Box 3
                        </p>
                        <button id="button3" class="myButton">Create a new element (append() to box)</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="box4" class="box">
                        <p>
                            Box 4
                        </p>
                        <button id="button4" class="myButton">Create a new element (prepend() to box)</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="box5" class="box">
                        <p>
                            Box 5
                        </p>
                        <button id="button5" class="myButton">Insert a new element before other elements</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="" class="box">
                        <p>
                            Box 6
                        </p>
                        <button id="button6" class="myButton">As above but manipulating HTML without an ID, instead using NodeList</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>
                    
                    <div id="box7" class="box">
                        <p>
                            Box 7
                        </p>
                        <button id="button7" class="myButton">Remove an element</button>
                        <br>
                        <button id="" class="reset myButton">Reset</button>
                    </div>

            </tr>
            
            <tr>
                <td>
                    <h3>Resources</h3>
                    <p>

            </tr>

            <tr>
                <td id="code" class="code">
